name: Validate SHF_INFO_LINK regression
on:
  push:
    branches: [review/sh-info-link-ci-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  autotools:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Autotools and compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool build-essential binutils
      - name: Bootstrap and configure
        run: |
          ./bootstrap.sh
          ./configure
      - name: Build
        run: make -j2
      - name: Check all test fixtures including section-info
        run: make check -j2
      - name: Preserve failing test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autotools-failure-logs
          path: |
            tests/test-suite.log
            tests/*.log
          if-no-files-found: ignore
